<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shanky — The Gallery</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The Gallery — Shanky" />
  <meta property="og:image" content="https://designshanky.com/share-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="fonts/fonts.css?v=2" />
  <style>
    :root{
      --bg-a:#1a1a1f;
      --bg-b:#0e0e11;
      --ink:#f4f3ee;
      --muted:rgba(244,243,238,.5);
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      font-family:"Inter", system-ui, sans-serif;
      color:var(--ink);
      overflow:hidden;
      background:
        radial-gradient(120% 120% at 50% 30%, var(--bg-a) 0%, var(--bg-b) 60%, #08080a 100%);
      -webkit-font-smoothing:antialiased;
    }

    /* duotone drift: the two case accents as blurred orbs, slowly orbiting
       opposite corners behind the card ring */
    .orbs i{ position:fixed; display:block; border-radius:50%; pointer-events:none; z-index:0; }
    .orb--a{ left:16%; top:22%; width:640px; height:640px; transform:translate(-50%,-50%);
      background:radial-gradient(circle, rgba(217,139,176,.44) 0%, rgba(217,139,176,.13) 42%, transparent 70%);
      filter:blur(80px); animation:driftA 16s ease-in-out infinite alternate; }
    .orb--b{ left:84%; top:78%; width:720px; height:720px; transform:translate(-50%,-50%);
      background:radial-gradient(circle, rgba(115,199,189,.42) 0%, rgba(115,199,189,.13) 42%, transparent 70%);
      filter:blur(80px); animation:driftB 19s ease-in-out infinite alternate; }
    @keyframes driftA{ from{ margin-left:-40px; margin-top:-20px; } to{ margin-left:60px; margin-top:30px; } }
    @keyframes driftB{ from{ margin-left:50px; margin-top:20px; } to{ margin-left:-60px; margin-top:-30px; } }
    @media (prefers-reduced-motion:reduce){ .orb--a,.orb--b{ animation:none; } }

    /* WebGL canvas */
    #gl{
      z-index:1;
      position:fixed; inset:0; display:block;
      width:100%; height:100%;
      cursor:grab; touch-action:none;
    }
    #gl.dragging{ cursor:grabbing; }
    #gl.hovering{ cursor:pointer; }

    /* subtle film grain — screen-blended so it reads in the dark room */
    .grain{
      position:fixed; inset:0; pointer-events:none; z-index:2; opacity:.045;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      mix-blend-mode:screen;
    }

    /* top + bottom UI chrome */
    .chrome{ position:fixed; z-index:3; left:0; right:0; pointer-events:none; }
    .chrome--top{ top:0; padding:26px 34px; display:flex; justify-content:space-between; align-items:flex-start; }
    .chrome--bottom{ bottom:0; padding:26px 34px; display:flex; justify-content:space-between; align-items:flex-end; }
    .chrome a{ pointer-events:auto; }

    .brand{ font-weight:600; letter-spacing:.16em; font-size:13px; text-transform:uppercase; display:flex; align-items:center; gap:9px; color:var(--ink); text-decoration:none; }
    .brand i{ width:8px; height:8px; border-radius:50%; background:var(--ink); display:inline-block; }
    .eyebrow{ font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
    .title-lg{ font-family:"Instrument Serif", Georgia, serif; font-size:clamp(28px,5vw,56px); line-height:.98; font-weight:400; }
    .title-lg em{ font-style:italic; }
    .hint{ display:flex; align-items:center; gap:10px; font-size:12.5px; letter-spacing:.04em; color:var(--muted); transition:opacity .6s ease; }
    .hint .key{ display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border:1px solid rgba(244,243,238,.18); border-radius:99px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); background:rgba(244,243,238,.06); }
    .hint.hide{ opacity:0; }
    .counter{ font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--muted); letter-spacing:.06em; }

    /* loader */
    .loader{ position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:#0b0b0e;
      transition:opacity .8s ease, visibility .8s ease; }
    .loader.done{ opacity:0; visibility:hidden; }
    .loader__txt{ font-family:"Instrument Serif",Georgia,serif; font-size:clamp(30px,6vw,64px); }
    .loader__bar{ position:absolute; left:34px; right:34px; bottom:30px; height:1px; background:rgba(244,243,238,.14); }
    .loader__bar i{ display:block; height:100%; width:0%; background:var(--ink); transition:width .25s ease; }

    /* ---------- Detail page overlay ---------- */
    .detail{
      position:fixed; inset:0; z-index:6; visibility:hidden;
      clip-path:circle(0px at 50% 50%);
      display:flex; flex-direction:column;
      color:#f4f3ee;
    }
    .detail.open{ visibility:visible; }
    .detail__bg{ position:absolute; inset:0; z-index:-1; }
    .detail__inner{ max-width:1100px; width:100%; margin:0 auto; padding:120px 40px 60px; flex:1; display:grid;
      grid-template-columns:1.05fr 1fr; gap:56px; align-items:center; }
    .detail__meta .tag{ display:inline-block; padding:7px 14px; border-radius:99px; background:#f4f3ee; color:#0b0b0e;
      font-size:12px; letter-spacing:.04em; font-weight:500; margin-bottom:26px; }
    .detail__title{ font-family:"Instrument Serif",Georgia,serif; font-weight:400; font-size:clamp(40px,6vw,82px);
      line-height:.96; margin-bottom:24px; }
    .detail__title em{ font-style:italic; }
    .detail__section{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:rgba(244,243,238,.55); margin-bottom:14px; }
    .detail__desc{ font-size:16px; line-height:1.65; max-width:52ch; color:rgba(244,243,238,.78); margin-bottom:34px; }
    .detail__stats{ display:flex; gap:38px; }
    .detail__stat b{ display:block; font-family:"Instrument Serif",Georgia,serif; font-size:34px; font-weight:400; }
    .detail__stat span{ font-size:12.5px; color:rgba(244,243,238,.55); letter-spacing:.03em; }
    .detail__link{ display:inline-flex; align-items:center; gap:8px; margin-top:34px; font-size:13.5px; color:#f4f3ee;
      text-decoration:none; border-bottom:1px solid rgba(244,243,238,.35); padding-bottom:3px; transition:gap .25s ease, border-color .25s ease; }
    .detail__link:hover{ gap:12px; border-color:rgba(244,243,238,.85); }
    .detail__media{ display:flex; flex-direction:column; gap:14px; }
    .detail__media img{ width:100%; aspect-ratio:4/5; object-fit:contain; display:block;
      border-radius:18px; background:rgba(244,243,238,.05); box-shadow:0 40px 90px -40px rgba(0,0,0,.9); }
    .detail__caption{ font-size:12.5px; line-height:1.5; color:rgba(244,243,238,.55); max-width:44ch; }
    .detail__top{ position:absolute; top:0; left:0; right:0; z-index:2; padding:26px 34px;
      display:flex; justify-content:space-between; align-items:center; }
    .back{ pointer-events:auto; cursor:pointer; background:none; border:1px solid rgba(244,243,238,.28); color:inherit;
      border-radius:99px; padding:10px 18px 10px 14px; font:inherit; font-size:13px; display:flex; align-items:center; gap:9px;
      transition:background .25s ease, padding .25s ease; }
    .back:hover{ background:rgba(244,243,238,.08); }
    .back svg{ width:16px; height:16px; }
    .detail__index{ font-family:"Instrument Serif",Georgia,serif; font-size:14px; }
    @media (max-width:860px){
      .detail__inner{ grid-template-columns:1fr; gap:30px; padding:100px 26px 50px; align-content:center; }
      .detail__media{ order:-1; }
      .detail__media img{ aspect-ratio:auto; max-height:34vh; }
      .detail__link{ margin-top:24px; }
      .chrome--bottom .title-lg{ display:none; }
    }
  </style>
</head>
<body>
  <div class="orbs" aria-hidden="true"><i class="orb--a"></i><i class="orb--b"></i></div>
  <canvas id="gl"></canvas>
  <div class="grain"></div>

  <!-- chrome -->
  <header class="chrome chrome--top">
    <a class="brand" href="index.html"><i></i>SHANKY</a>
    <span class="eyebrow">Selected Work — 2026</span>
  </header>
  <div class="chrome chrome--bottom">
    <h1 class="title-lg">The <em>Gallery</em></h1>
    <div style="text-align:right; display:flex; flex-direction:column; gap:12px; align-items:flex-end;">
      <span class="counter" id="counter">— / —</span>
      <span class="hint" id="hint">
        <span class="key">Drag</span> to look around
        <span class="key">Click</span> a card
      </span>
    </div>
  </div>

  <!-- loader -->
  <div class="loader" id="loader">
    <div class="loader__txt">Hanging the gallery…</div>
    <div class="loader__bar"><i id="loaderbar"></i></div>
  </div>

  <!-- detail page -->
  <section class="detail" id="detail" aria-hidden="true">
    <div class="detail__bg" id="detailBg"></div>
    <div class="detail__top">
      <button class="back" id="back" aria-label="Back to gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back
      </button>
      <span class="detail__index" id="detailIndex">01</span>
    </div>
    <div class="detail__inner">
      <div class="detail__meta">
        <span class="tag" id="detailTag">Case study</span>
        <h2 class="detail__title" id="detailTitle">Title</h2>
        <p class="detail__section" id="detailSection">Section</p>
        <p class="detail__desc" id="detailDesc">Description</p>
        <div class="detail__stats" id="detailStats"></div>
        <a class="detail__link" id="detailLink" href="/">Read the case study <span>↗</span></a>
      </div>
      <figure class="detail__media">
        <img id="detailImg" alt="" />
        <figcaption class="detail__caption" id="detailCaption"></figcaption>
      </figure>
    </div>
  </section>

  <script src="vendor/gsap.min.js?v=2"></script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js?v=2" } }
  </script>
  <script type="module" src="js/gallery.js?v=12"></script>
</body>
</html>
